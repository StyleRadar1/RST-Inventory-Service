name: CI - Integración Continua y Calidad

on:
  pull_request:
    branches:
      - master
      - main
      - develop
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test-and-quality:
    name: Build, Tests & Quality Gate
    runs-on: ubuntu-latest

    env:
      SPRING_PROFILES_ACTIVE: test
      DB_URL: jdbc:h2:mem:testdb
      DB_USERNAME: sa
      DB_PASSWORD: sa

    steps:
      - name: Checkout del código (Historial completo para Sonar)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permisos de ejecución a mvnw
        run: chmod +x mvnw

      # 'verify' corre tests y valida la regla estricta de JaCoCo (falla si < 85%)
      - name: Ejecutar pruebas y validar JaCoCo (>= 85%)
        run: ./mvnw -B -ntp clean verify

      - name: Publicar reporte de resultados de pruebas
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: '**/target/surefire-reports/*.xml'
          check_name: 'Resultados de Pruebas Unitarias'
          comment_mode: always

      # Ejecuta SonarQube si existe el secreto, de lo contrario continúa sin romper
      - name: Análisis Estático SonarQube
        continue-on-error: true
        run: ./mvnw -B -ntp sonar:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir reporte HTML de JaCoCo como artefacto
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report-${{ github.sha }}
          path: target/site/jacoco/
          retention-days: 7

  docker-dry-run:
    name: Validar compilación de Dockerfile
    runs-on: ubuntu-latest
    needs: test-and-quality

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Prueba que el Dockerfile construya limpiamente sin subirlo
      - name: Construir imagen (Dry-run de prueba)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: test-image:test    # <-- 100% en minúsculas, infalible
          cache-from: type=gha
          cache-to: type=gha,mode=max