server:
  port: ${SERVER_PORT:8200}
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      force: true

clients:
  item-catalogo:
    url: ${ITEM_CATALOGO_URL:http://localhost:8220}
  tiendas:
    url: ${TIENDAS_URL:http://localhost:8140/api/v1}

# Una tienda solo escribe su propio inventario. Se puede apagar si ms-tiendas cambia su contrato
inventario:
  propiedad:
    exigir: ${INVENTARIO_EXIGIR_PROPIETARIO:true}

spring:
  application:
    name: ms-inventario
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventario_db}?sslmode=${DB_SSL_MODE:prefer}
    username: ${DB_USER:styleradar_user}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:3}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      idle-timeout: 60000
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:60000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 5000
            read-timeout: 15000
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
      verify-hostname: ${RABBITMQ_SSL_VERIFY_HOSTNAME:true}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000ms

springdoc:
  api-docs:
    path: /api/v1/v3/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
